services:
  - type: web
    name: mobile-money-fds-api
    runtime: docker
    rootDir: /
    plan: free
    healthCheckPath: /health
    dockerfilePath: backend/Dockerfile
    envVars:
      # Replace with your deployed frontend origin(s), comma-separated.
      # e.g. https://mobile-money-fds.vercel.app
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: FRAUD_MODEL_BLEND_WEIGHT
        value: "0.5"
