services:
  - type: web
    name: mobile-money-fds-api
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      # Replace with your deployed frontend origin(s), comma-separated.
      # e.g. https://mobile-money-fds.vercel.app
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://127.0.0.1:5173
      - key: FRAUD_MODEL_BLEND_WEIGHT
        value: "0.5"
